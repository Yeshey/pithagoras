name: Weekly Upstream Sync

on:
  schedule:
    - cron: '0 0 * * 1' # Every Monday at 00:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    if: github.repository == 'Yeshey/pithagoras'

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.SYNC_PAT }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/thecodacus/pithagoras.git || true
          git fetch upstream main

      - name: Merge upstream
        id: merge
        shell: bash
        run: |
          before=$(git rev-parse HEAD)
          fork_only=".github/workflows/weekly-upstream-sync.yml"
          keep_ours=".github/workflows/docker.yml"

          git merge upstream/main --no-commit --no-ff || true

          if git rev-parse -q --verify MERGE_HEAD >/dev/null; then
            # Resolve conflicts: keep fork's docker.yml, upstream wins elsewhere
            for f in $(git diff --name-only --diff-filter=U); do
              if [[ "$f" == "$keep_ours" || "$f" == "$fork_only" ]]; then
                git checkout --ours -- "$f" 2>/dev/null || git rm -fq -- "$f"
              else
                git checkout --theirs -- "$f" 2>/dev/null || git rm -fq -- "$f"
              fi
              git add -A -- "$f"
            done

            # Fork-only sync workflow always stays as-is
            git checkout "$before" -- "$fork_only"
            git add "$fork_only"

            git commit -m "Merge upstream/main"
          fi

          if [[ "$(git rev-parse HEAD)" != "$before" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Push to origin
        if: steps.merge.outputs.changed == 'true'
        run: git push origin main

      - name: Trigger Docker build
        if: steps.merge.outputs.changed == 'true'
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.SYNC_PAT }}
          event-type: build-docker
