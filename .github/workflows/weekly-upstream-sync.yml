name: Weekly Upstream Sync

on:
  schedule:
    - cron: '0 0 * * 1' # Every Monday at 00:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    if: github.repository == 'Yeshey/pithagoras'

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/thecodacus/pithagoras.git
          git fetch upstream

      - name: Merge upstream, preserving custom docker.yml
        id: merge
        run: |
          cp .github/workflows/docker.yml /tmp/custom-docker.yml

          if git merge upstream/main --no-edit -X theirs; then
            echo "✅ Merge succeeded"
          else
            echo "⚠️ Merge failed unexpectedly; aborting"
            git merge --abort
            exit 1
          fi

          cp /tmp/custom-docker.yml .github/workflows/docker.yml
          git add .github/workflows/docker.yml

          if git diff --cached --quiet; then
            echo "ℹ️ Nothing to commit — docker.yml unchanged after merge"
            echo "pushed=false" >> $GITHUB_OUTPUT
          else
            git commit -m "chore: preserve custom aarch64 docker workflow"
            echo "pushed=true" >> $GITHUB_OUTPUT
          fi

      - name: Push to origin
        run: git push origin main

      - name: Trigger docker build
        if: steps.merge.outputs.pushed == 'true'
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          event-type: build-docker
