name: Weekly Upstream Sync

on:
  schedule:
    - cron: '0 0 * * 1' # Every Monday at 00:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    if: github.repository == 'Yeshey/pithagoras'

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/thecodacus/pithagoras.git
          git fetch upstream main

      - name: Merge upstream and preserve Docker workflow
        id: merge
        shell: bash
        run: |
          before=$(git rev-parse HEAD)
          cp .github/workflows/docker.yml /tmp/custom-docker.yml

          git merge upstream/main --no-edit -X theirs

          cp /tmp/custom-docker.yml .github/workflows/docker.yml
          git add .github/workflows/docker.yml

          if ! git diff --cached --quiet; then
            git commit -m "chore: preserve custom aarch64 docker workflow"
          fi

          if [[ "$(git rev-parse HEAD)" != "$before" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Push to origin
        if: steps.merge.outputs.changed == 'true'
        run: git push origin main

      - name: Trigger Docker build
        if: steps.merge.outputs.changed == 'true'
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          event-type: build-docker
