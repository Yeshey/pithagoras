name: Build and publish container

on:
  push:
    branches: [main]
  repository_dispatch:
    types: [build-docker]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-latest
            platform: linux/amd64

          - architecture: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64

    runs-on: ${{ matrix.runner }}

    permissions:
      contents: read
      packages: write

    steps:
      - name: Set lowercase image name
        shell: bash
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install
      - run: npm run build

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ env.IMAGE }}:${{ matrix.architecture }}-${{ github.sha }}
          cache-from: type=gha,scope=build-${{ matrix.architecture }}
          cache-to: type=gha,mode=max,scope=build-${{ matrix.architecture }}

  merge:
    needs: build
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Set lowercase image name
        shell: bash
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha

      - name: Create multi-platform image
        shell: bash
        env:
          METADATA_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          tags=()

          while IFS= read -r tag; do
            if [[ -n "$tag" ]]; then
              tags+=("--tag" "$tag")
            fi
          done <<< "$METADATA_TAGS"

          docker buildx imagetools create \
            "${tags[@]}" \
            "${IMAGE}:amd64-${GITHUB_SHA}" \
            "${IMAGE}:arm64-${GITHUB_SHA}"
